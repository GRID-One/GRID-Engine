[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/persistence",
    "crates/ingestion",
    "crates/identity",
    "crates/features",
    "crates/models",
    "crates/simulation",
    "crates/scoring",
    "crates/evaluation",
    "crates/governance",
    "crates/pipeline",
    "crates/grid-cli",
    "crates/synth",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
authors = ["GRID-Alpha Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GRID-One/GRID-Engine"

[workspace.dependencies]
# Intra-workspace crates. cargo-deny `wildcards = "deny"` treats a path dependency with no version
# requirement as a wildcard, so the version is stated here once, in step with
# [workspace.package] version, and members use `<crate>.workspace = true` (P1-01).
grid-domain = { path = "crates/domain", version = "0.1.0-alpha.1" }
grid-pipeline = { path = "crates/pipeline", version = "0.1.0-alpha.1" }
tokio = { version = "1.40", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
nalgebra = "0.33"
sprs = "0.11"
statrs = "0.17"
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }