[pytest]
# Reference-oracle test configuration (not upstream; see README.md).
#
# This file pins rootdir to reference/python, so neither the Rust workspace root nor any
# parent config is picked up. `pythonpath = .` puts this directory on sys.path, so the
# absolute `backend.*` / `tests.*` / `tools.*` imports resolve under plain `pytest` as well
# as `python -m pytest`, with no root conftest.py.
#
# `-p tools.pytest_isolation_guard` enforces the oracle's isolation property for every run:
# no network access and no import of an app-only module (backend.api, backend.services,
# backend.trades, backend.adapters, backend.viz_agent, fastapi, uvicorn, anthropic, posthog,
# httpx, websockets, ...). A violation fails the session. It needs pytest >= 8.4 (see
# requirements.txt).
testpaths = tests
pythonpath = .
addopts = -p tools.pytest_isolation_guard
